name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - v7

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        # The library is still built for 17 (maven.compiler.release), but the
        # tests that compile the documentation's interactive examples need a
        # compiler that understands them: they are Java 25 compact source files,
        # and on an older JDK those two tests can only skip.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run tests
        run: mvn -B verify

      # The online IDE gets its 7.0 branch in Phase 8; until then the
      # 7.0 library cannot be checked against it.
      - name: Check browser compatibility and generated references
        if: github.ref_name != 'v7' && github.head_ref != 'v7'
        uses: ./.github/actions/check-browser
